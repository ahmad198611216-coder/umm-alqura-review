<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Art of Advertising – Grammar</title>
<meta name="description" content="Interactive active-learning grammar lesson – Mega Goal 1, Unit 4">
<meta name="theme-color" content="#6b2d5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#6b2d5c;--plum2:#8e3f7a;--rose:#e0507f;--blush:#fde8ef;--blush2:#f9d3df;
  --gold:#c9932e;--gold2:#f3d68c;--cream:#fffaf6;--ink:#3a2433;--muted:#7d6573;
  --mint:#21907f;--mintbg:#dff5ef;--coral:#d9534f;--coralbg:#fde3e1;--lav:#efe6fb;--sky:#e3f0fb;
  --sa:#006c35;--sa2:#e6f2ea;--r:20px;--shadow:0 10px 30px rgba(107,45,92,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700}
body{overflow:hidden;background:radial-gradient(circle at 10% 0%,#ffe9f1 0,transparent 40%),radial-gradient(circle at 100% 100%,#f3eafc 0,transparent 45%),var(--cream)}
h1,h2,h3,.fd{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-bottom:1px solid #f1dde6;z-index:5}
.brand{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;color:var(--plum);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{display:block;font-family:'Nunito';font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.5px}
.tbtn{background:#fff;border:1.5px solid #ecd3de;border-radius:12px;padding:8px 11px;font-size:15px;color:var(--plum);display:flex;align-items:center;gap:6px}
.tbtn:active{transform:scale(.96)}
/* stage */
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 30px;display:none;-webkit-overflow-scrolling:touch}
.slide.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:1100px;margin:0 auto}
@media(min-width:1180px) and (min-height:640px){.slide>.wrap:not(:has(.vbox)),.slide>.cover{zoom:1.15}}
@media(min-width:1500px) and (min-height:800px){.slide>.wrap:not(:has(.vbox)),.slide>.cover{zoom:1.35}}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--blush);color:var(--rose);padding:6px 14px;border-radius:999px;font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
.title{font-size:clamp(28px,5.2vw,54px);color:var(--plum);margin:12px 0 6px;line-height:1.1}
.sub{color:var(--muted);font-size:clamp(15px,2vw,20px);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1.5px solid #f5e3ea}
.card h3{color:var(--plum);font-size:clamp(19px,2.4vw,25px);margin-bottom:8px}
.big{font-size:clamp(18px,2.4vw,26px);line-height:1.45}
.mid{font-size:clamp(16px,2vw,21px);line-height:1.5}
.hl{color:var(--rose)}.hp{color:var(--plum2)}.hg{color:var(--gold)}.hm{color:var(--mint)}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--lav);color:var(--plum);font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:clamp(16px,2vw,21px)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:clamp(17px,2.3vw,24px)}
.formula span{background:var(--blush);color:var(--plum);padding:6px 12px;border-radius:12px}
.formula b{color:var(--muted);font-weight:600}
.emoji{font-size:clamp(34px,6vw,58px);line-height:1}
.tag{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
/* cover */
.cover{min-height:100%;display:flex;align-items:center}
.cover .wrap{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center;width:100%}
@media(max-width:760px){.cover .wrap{grid-template-columns:1fr}}
.hero{position:relative;aspect-ratio:1;max-width:420px;width:100%;justify-self:center;border-radius:50%;background:radial-gradient(circle,#fff 0,#fde8ef 60%,#f9d3df 100%);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero .e{position:absolute;font-size:clamp(40px,8vw,74px);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{background:#fff;border:1.5px solid #f0d7e2;border-radius:12px;padding:8px 12px;font-size:15px;color:var(--plum)}
.cta{background:linear-gradient(135deg,var(--rose),var(--plum2));color:#fff;padding:14px 26px;border-radius:16px;font-size:19px;font-family:'Fredoka','Nunito',system-ui,sans-serif;box-shadow:0 10px 24px rgba(224,80,127,.35);margin-top:20px}
/* options & feedback */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.opt{background:#fff;border:2px solid #ecd3de;border-radius:16px;padding:14px 12px;font-size:clamp(16px,2.1vw,21px);color:var(--plum);font-family:'Fredoka','Nunito',system-ui,sans-serif;transition:.15s}
.opt:hover{border-color:var(--rose)}
.opt.ok{background:var(--mintbg);border-color:var(--mint);color:var(--mint)}
.opt.no{background:var(--coralbg);border-color:var(--coral);color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{min-height:26px;margin-top:10px;font-size:clamp(15px,1.9vw,19px)}
.fb.ok{color:var(--mint)}.fb.no{color:var(--coral)}
.q{font-size:clamp(19px,2.6vw,28px);line-height:1.4;color:var(--ink)}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--rose);color:var(--rose);text-align:center;padding:0 6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prog{display:flex;gap:6px}.prog i{width:10px;height:10px;border-radius:50%;background:#efd9e3}.prog i.d{background:var(--rose)}
.btn{background:var(--plum);color:#fff;border-radius:14px;padding:11px 18px;font-size:16px;font-family:'Fredoka','Nunito',system-ui,sans-serif}
.btn.ghost{background:#fff;color:var(--plum);border:2px solid #ecd3de}
.btn.gold{background:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reveal{cursor:pointer}
.reveal .ans{display:none}.reveal.open .ans{display:block;animation:in .3s}
.reveal .hint{color:var(--muted);font-size:14px}.reveal.open .hint{display:none}
/* tense table */
.tense{display:grid;grid-template-columns:150px 1fr;gap:0;border-radius:16px;overflow:hidden;border:1.5px solid #f0d7e2}
.tense>div{padding:12px 14px;border-bottom:1px solid #f5e6ec;background:#fff}
.tense>div:nth-child(odd){background:var(--blush);color:var(--plum);font-family:'Fredoka','Nunito',system-ui,sans-serif}
@media(max-width:560px){.tense{grid-template-columns:1fr}.tense>div:nth-child(odd){padding-bottom:4px}}
/* builder */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:16px;background:var(--blush);border:2px dashed #eab8cb}
.chip{background:#fff;border:2px solid #ecd3de;border-radius:12px;padding:10px 14px;font-size:clamp(16px,2.1vw,21px);color:var(--plum);font-family:'Fredoka','Nunito',system-ui,sans-serif}
.chip.used{opacity:.25;pointer-events:none}
.tray .chip{background:var(--plum);color:#fff;border-color:var(--plum)}
/* products */
.prod{text-align:center;position:relative}
.prod .emoji{margin:4px 0 8px}
.prod .nm{font-family:'Fredoka','Nunito',system-ui,sans-serif;color:var(--plum);font-size:20px}
.prod .spec{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.prod .spec span{background:var(--cream);border:1px solid #f1dde6;border-radius:10px;padding:4px 8px;font-size:14px;color:var(--muted)}
/* scale */
.scale{position:relative;height:200px;max-width:520px;margin:10px auto 0}
.beam{position:absolute;left:8%;right:8%;top:70px;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--plum2),var(--rose));transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 50%}
.pan{position:absolute;top:-62px;width:96px;height:62px;display:grid;place-items:center;font-size:44px}
.pan.l{left:-10px}.pan.r{right:-10px}
.pivot{position:absolute;left:50%;top:82px;transform:translateX(-50%);width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:80px solid var(--ink)}
.sign{position:absolute;left:50%;top:0;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;background:var(--muted);font-family:'Fredoka','Nunito',system-ui,sans-serif;transition:.3s}
.sign.eq{background:var(--plum2)}.sign.ne{background:#e2793a}
.pairs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pairb{background:#fff;border:2px solid #ecd3de;border-radius:16px;padding:12px;text-align:left;font-size:16px;color:var(--plum)}
.pairb.on{border-color:var(--rose);background:var(--blush)}
/* senses */
.sense{text-align:center}
.sense .emoji{margin-bottom:6px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media(max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1/1.05;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center}
.mc .fa{background:linear-gradient(135deg,var(--rose),var(--plum2));color:#fff;font-size:30px}
.mc .ba{background:#fff;border:2px solid #ecd3de;color:var(--plum);transform:rotateY(180deg);font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:clamp(14px,2.4vw,20px)}
.mc.m .ba{background:var(--mintbg);border-color:var(--mint);color:var(--mint)}
/* levels */
.lvls{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.lvls{grid-template-columns:1fr}}
.lv{border-radius:18px;padding:14px;text-align:left;border:2px solid transparent;background:#fff;box-shadow:var(--shadow)}
.lv .st{font-size:22px}.lv .nm{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:20px}.lv .ds{font-size:14px;color:var(--muted)}
.lv.a{border-color:var(--rose);background:var(--blush)}
/* wheel */
.wheelbox{position:relative;width:min(80vw,380px);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4s cubic-bezier(.15,.9,.2,1);box-shadow:var(--shadow);border:8px solid #fff}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--plum);z-index:2}
.hub{position:absolute;inset:40%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.prompt{min-height:90px;display:grid;place-items:center;text-align:center}
/* ads */
.ad{border-radius:22px;padding:20px;position:relative;overflow:hidden;min-height:250px}
.ad.a{background:linear-gradient(140deg,#2b1630,#6b2d5c);color:#fff}
.ad.b{background:linear-gradient(140deg,#fff3e6,#fde3ec);border:1.5px solid #f2d3dc}
.ad .lbl{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);border-radius:10px;padding:4px 10px;font-size:13px}
.ad.b .lbl{background:var(--plum);color:#fff}
/* bottom nav */
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-top:1px solid #f1dde6}
.nb{width:52px;height:46px;border-radius:14px;background:var(--plum);color:#fff;font-size:22px;display:grid;place-items:center}
.nb:disabled{opacity:.3}
.bar{flex:1;height:8px;border-radius:9px;background:#f3e1e9;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .4s}
.cnt{font-size:14px;color:var(--muted);min-width:46px;text-align:center}
/* teams */
.teams{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid #f1dde6;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.tm{display:flex;align-items:center;gap:6px;background:var(--cream);border:1.5px solid #f0d7e2;border-radius:14px;padding:4px 6px 4px 10px;white-space:nowrap;font-size:14px}
.tm b{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:18px;color:var(--plum);min-width:22px;text-align:center}
.tm button{width:30px;height:30px;border-radius:10px;background:var(--rose);color:#fff;font-size:18px}
.tm button.m{background:#fff;color:var(--muted);border:1.5px solid #ecd3de}
.hide{display:none!important}
/* menu */
.menu{position:fixed;inset:0;background:rgba(58,36,51,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.menu.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom))}
.sheet a{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;color:var(--plum);text-decoration:none;font-size:16px}
.sheet a:hover,.sheet a.cur{background:var(--blush)}
.sheet a span{width:28px;height:28px;border-radius:8px;background:var(--lav);display:grid;place-items:center;font-size:13px}
/* timer */
.timer{position:fixed;right:14px;bottom:84px;z-index:9;background:var(--plum);color:#fff;border-radius:18px;padding:10px 16px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:26px;box-shadow:var(--shadow);display:none}
.timer.on{display:block}.timer.end{background:var(--coral);animation:shake .4s 3}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.vbox{position:relative;width:100%;max-width:min(100%,calc((100dvh - 330px)*16/9));margin:0 auto;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#2a1426}.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.before{background:var(--lav);border-color:#e2d4f5;margin-bottom:14px}.after{background:var(--mintbg);border-color:#bfe8dd;margin-top:14px}
.note{background:var(--sky);border-radius:16px;padding:12px 14px;color:#2d5277;font-size:15px}
.score-big{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:54px;color:var(--plum)}
.para{font-size:clamp(17px,2.2vw,22px);line-height:2}
.para select{font:inherit;font-size:.9em;border:2px solid #ecd3de;border-radius:10px;padding:2px 6px;color:var(--plum);background:#fff}
.para select.ok{border-color:var(--mint);background:var(--mintbg)}.para select.no{border-color:var(--coral);background:var(--coralbg)}
/* saudi */
.sa-kick{background:var(--sa2)!important;color:var(--sa)!important}
.sa-card{border-top:5px solid var(--sa)}
.sa-card h3{color:var(--sa)!important}
.sa-band{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--sa),#0b8a48);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:14px;font-size:clamp(16px,2vw,20px)}
.sa-band .f{font-size:34px}
/* values */
.ar{font-family:'Amiri','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;direction:rtl;font-size:clamp(22px,3vw,32px);color:var(--plum);line-height:1.6}
.value{border-top:5px solid var(--gold)}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.hc button{border-radius:18px;padding:18px 10px;font-size:clamp(19px,2.6vw,26px);font-family:'Fredoka','Nunito',system-ui,sans-serif;color:#fff}
.hc .h{background:var(--mint)}.hc .c{background:var(--coral)}
/* pictures */
.pic{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size;background:#f3e6ec}
.pic img{display:block;width:100%;height:auto}
.pic .cap{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(58,22,52,.82);color:#fff;border-radius:12px;padding:8px 12px;font-size:clamp(14px,1.8vw,18px)}
.board{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2cqw;color:var(--plum)}
.board .k{font-size:2.4cqw;letter-spacing:.4cqw;color:var(--rose);font-weight:800;text-transform:uppercase}
.board .t{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:5.6cqw;line-height:1.1;margin:.8cqw 0}
.board .s{font-size:2.6cqw;color:var(--muted)}
.board .t b{color:var(--rose)}
.pics2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.qimg{max-width:640px;margin:0 auto 12px}
/* full screen */
.fsbtn{float:right;margin:2px 0 0 10px;background:#fff;border:2px solid #ecd3de;color:var(--plum);border-radius:12px;padding:8px 12px;font-size:14px;font-family:'Fredoka','Nunito',system-ui,sans-serif}
body.focus .top,body.focus .fsbtn{display:none}
body.focus .slide{padding-top:16px}
.fsx{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:25;display:none;background:var(--plum);color:#fff;border-radius:14px;padding:9px 14px;font-size:14px;box-shadow:var(--shadow)}
body.focus .fsx{display:block}
@media(max-width:700px){body.focus .q{font-size:24px}body.focus .opt{font-size:19px;padding:16px 10px}}
/* true/false */
.tfbig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tfbig button{border-radius:20px;padding:22px 10px;font-size:clamp(22px,3vw,30px);font-family:'Fredoka','Nunito',system-ui,sans-serif;color:#fff}
.tfbig .t{background:var(--mint)}.tfbig .f{background:var(--coral)}
.clock{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:30px;color:var(--plum)}
.stmt{font-size:clamp(21px,3vw,32px);text-align:center;min-height:90px;display:grid;place-items:center;line-height:1.35}
/* sort */
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.bucket{border-radius:18px;border:2px dashed #e3bfd0;background:#fff;padding:10px;min-height:120px;text-align:left}
.bucket h4{margin:0 0 8px;font-family:'Fredoka','Nunito',system-ui,sans-serif;color:var(--plum);font-size:18px}
.bucket.ready{border-color:var(--rose);background:var(--blush)}
.bucket .done{font-size:14px;background:var(--mintbg);color:var(--mint);border-radius:10px;padding:6px 8px;margin-top:6px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.scard{background:#fff;border:2px solid #ecd3de;border-radius:14px;padding:10px 12px;font-size:clamp(15px,1.9vw,19px);color:var(--ink);text-align:left}
.scard.sel{border-color:var(--rose);background:var(--blush);transform:translateY(-2px)}
/* bank */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border-radius:999px;padding:9px 16px;background:#fff;border:2px solid #ecd3de;color:var(--plum);font-size:15px}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s;

/* ---------- confetti ---------- */
const cv=$('#conf'),cx=cv.getContext('2d');let parts=[];
function confetti(n=90){cv.width=innerWidth;cv.height=innerHeight;const c=['#e0507f','#c9932e','#8e3f7a','#21907f','#f3d68c'];
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*7+4,c:c[i%5],r:Math.random()*6,l:90});
 if(parts.length===n)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- sound ---------- */
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.09)}else{o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(170,t+.12)}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.32)}catch(e){}}
const PRAISE=['Excellent! 🌟','Great job! 💖','Brilliant! ✨','Well done! 🌸','Perfect! 💎','Super! 🎀'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- generic MCQ game ---------- */
function mcq(el,items,{title='',showQ=true}={}){
  let i=0,score=0,tries=0;
  function render(){
    if(i>=items.length){el.innerHTML=`<div class="card" style="text-align:center"><div class="emoji">🏅</div><div class="score-big">${score}/${items.length}</div><p class="mid">${score===items.length?'Amazing – full marks!':'Good effort! Try again to get them all.'}</p><button class="btn" data-r>Play again ↻</button></div>`;$('[data-r]',el).onclick=()=>{i=0;score=0;render()};if(score===items.length)confetti();return}
    const it=items[i];tries=0;
    el.innerHTML=`<div class="card"><div class="qhead"><span class="tag">${title} · Question ${i+1} of ${items.length}</span><div class="prog">${items.map((_,k)=>`<i class="${k<i?'d':''}"></i>`).join('')}</div></div>
    ${it.img?`<div class="pic qimg"><img src="img/${it.img}.avif" alt="" width="720" height="405"></div>`:''}
    ${it.pre?`<div class="mid" style="color:var(--muted);margin-bottom:6px">${it.pre}</div>`:''}
    <div class="q">${it.q.replace('___','<span class="blank">?</span>')}</div>
    <div class="opts">${shuffle(it.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><div class="row" style="justify-content:flex-end"><button class="btn hide" data-n>Next ›</button></div></div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{
      if(b.classList.contains('ok')||$('.opt.ok',el))return;
      const ok=+b.dataset.k===0;tries++;beep(ok);
      const fb=$('#fb',el);
      if(ok){b.classList.add('ok');if(tries===1)score++;fb.className='fb ok';fb.innerHTML=praise()+(it.why?` <span style="color:var(--muted)">${it.why}</span>`:'');
        const bl=$('.blank',el);if(bl){bl.textContent=it.o[0];bl.style.borderColor='var(--mint)';bl.style.color='var(--mint)'}
        $('[data-n]',el).classList.remove('hide')}
      else{b.classList.add('no');fb.className='fb no';fb.textContent='Not quite – try again!'}
    });
    $('[data-n]',el).onclick=()=>{i++;render()};
  }render();
}

<div class="pic"><img src="img/presenter.avif" alt="A teacher holding a bottle of Taif rose oil next to a board" width="720" height="405"><div class="board" style="left:5%;top:3.5%;width:53.5%;height:52%"><div class="k">Grammar lesson</div><div class="t">The Art of <b>Advertising</b></div><div class="s">Mega Goal 1 · Unit 4</div></div></div>

<div class="card" style="text-align:center"><div class="emoji">🙋‍♀️</div><h3>Raise</h3><p class="mid" style="margin:0">your hand to answer</p></div>

  $$('input',box).forEach(c=>c.onchange=()=>{TEAMS[c.dataset.k].on=c.checked;drawTeams()});
  $('#teamsGo').onclick=()=>{$('#teams').classList.remove('hide');drawTeams()};
  $('#teamsReset').onclick=()=>{TEAMS.forEach(t=>t.s=0);drawTeams()};

<p class="sub">Read the two adverts. <b class="hp">Which advert gives more detailed information about the product? Why?</b></p>
<div class="grid g2">
<div class="ad a"><span class="lbl">Advert A</span><div class="emoji">👜</div><h3 class="fd" style="font-size:30px;margin:8px 0">GLOW BAG</h3><p class="big" style="margin:0">Small. Stylish. Yours.</p><p class="mid" style="opacity:.8">Buy it now!</p></div>
<div class="ad b"><span class="lbl">Advert B</span><div class="emoji">👜</div><h3 class="fd" style="font-size:26px;margin:8px 0;color:var(--plum)">LUNA Leather Handbag</h3>
<p class="mid" style="margin:0">This bag <b class="hl">is made by hand</b> in Riyadh from soft leather. It has three pockets, a gold zip and a long strap. It is <b class="hl">lighter than</b> most leather bags and <b class="hl">as strong as</b> a travel bag. Price: 350 SAR.</p></div>
</div>
<div class="row" style="margin-top:14px"><button class="btn" data-pick="b">Advert B 👍</button><button class="btn ghost" data-pick="a">Advert A</button><button class="btn gold" onclick="startTimer(60)">⏱️ 1-minute pair talk</button></div>
<div class="card reveal" style="margin-top:14px" id="adAns"><span class="hint">Tap to see the answer</span><div class="ans mid"><b class="hm">✅ Advert B.</b> It explains the product's <b>features</b>, <b>materials</b>, <b>special functions</b> and <b>price</b>. Look at the grammar it uses: <b class="hl">is made</b> (passive), <b class="hl">lighter than</b> (comparative) and <b class="hl">as strong as</b>. That's today's lesson!</div></div>
</div>`,()=>{
  $$('[data-pick]').forEach(b=>b.onclick=()=>{const ok=b.dataset.pick==='b';beep(ok);$('#adAns').classList.add('open');if(ok)confetti(50)});

<div class="grid g3" style="margin-top:8px">

</div>`,null);

add('Video: Active & Passive',`<div class="wrap"><span class="kicker">🎬 Video 2 · At the charity fair</span><h2 class="title">Change the focus</h2>
<div class="card before"><span class="tag">❓ Before you watch</span><p class="mid" style="margin:6px 0 0">At the charity fair, someone packed the gift boxes. <b class="hp">Is it important WHO packed them, or that the boxes are ready?</b></p></div>

<div class="card after"><span class="tag">✍️ After you watch · Change the focus</span><p class="mid" style="margin:6px 0 10px">Make these sentences <b class="hl">passive</b>. Tap each one to check.</p>
<div class="grid g2">
<div class="card reveal"><p class="mid" style="margin:0">Reem checked the boxes.</p><span class="hint">Tap for the answer</span><p class="mid ans" style="margin:6px 0 0">The boxes <b class="hl">were checked</b> by Reem.</p></div>
<div class="card reveal"><p class="mid" style="margin:0">The volunteers wrap the gifts.</p><span class="hint">Tap for the answer</span><p class="mid ans" style="margin:6px 0 0">The gifts <b class="hl">are wrapped</b> by the volunteers.</p></div>

</div></div></div>`,()=>$$('.reveal').forEach(r=>r.onclick=()=>r.classList.add('open')));

add('The passive voice',`<div class="wrap"><span class="kicker">🏭 Grammar 1</span><h2 class="title">The Passive Voice</h2>
<p class="sub">We use the passive to focus on <b class="hl">what was done</b>, not <b>who</b> did it.</p>
<div class="pic" style="margin-bottom:14px"><img src="img/factory.avif" alt="Bottles of rose oil on a factory line" width="720" height="405" loading="lazy"><div class="board" style="left:3.6%;top:6%;width:47.5%;height:30.5%"><div class="k">Passive voice</div><div class="t" style="font-size:4.2cqw">This rose oil <b>is made</b> in Saudi Arabia.</div><div class="s">The bottles <b style="color:var(--rose)">are filled</b> and <b style="color:var(--rose)">packed</b> here.</div></div></div>
<div class="card"><div class="formula"><span>subject</span><b>+</b><span>be</span><b>+</b><span>past participle</span><b>(+ by …)</b></div></div>
<div class="tense" style="margin-top:14px">
<div>Simple present</div><div class="mid">Taif rose oil <b class="hl">is made</b> in Saudi Arabia. 🌹</div>
<div>Simple past</div><div class="mid">The King Fahd Qur’an Printing Complex <b class="hl">was opened</b> in 1984. 📖</div>
<div>Present perfect</div><div class="mid">The Two Holy Mosques <b class="hl">have been expanded</b> many times. 🕋</div>
<div>Future</div><div class="mid">The charity boxes <b class="hl">will be delivered</b> tomorrow. 📦</div>
<div>by + agent</div><div class="mid">This Sadu bag <b class="hl">was woven by</b> a Saudi grandmother. 🧶</div>
</div>
<div class="grid g2" style="margin-top:14px">
<div class="card reveal"><h3>🔄 Active → Passive</h3><p class="mid" style="margin:0">A Saudi company <b>produces</b> this rose oil.</p><span class="hint">Tap to change it</span><p class="mid ans" style="margin:6px 0 0">This rose oil <b class="hl">is produced by</b> a Saudi company. 🌹</p></div>
<div class="note mid">💡 The <b>by + agent</b> is optional. We only use it when <b>who</b> did it is important.</div>
</div></div>`,()=>$$('.reveal').forEach(r=>r.onclick=()=>r.classList.add('open')));

add('Game: Active → Passive',`<div class="wrap"><span class="kicker">🔄 Game 2 · Active → Passive</span><h2 class="title">Choose the passive sentence</h2><div id="ap"></div></div>`,()=>mcq($('#ap'),[
  {pre:'Designers make these bags in Italy.',q:'These bags ___ in Italy.',o:['are made','were made','make'],why:'simple present → are + made'},
  {pre:'A Saudi company produced this rose oil.',q:'This rose oil ___ by a Saudi company.',o:['was produced','is produced','produced'],why:'simple past → was + produced'},
  {pre:'People have worn bracelets for thousands of years.',q:'Bracelets ___ for thousands of years.',o:['have been worn','has been worn','were wear'],why:'present perfect → have been + worn'},
  {pre:'The shop will wrap your gift.',q:'Your gift ___ by the shop.',o:['will be wrapped','will wrapped','is wrapping'],why:'future → will be + wrapped'},
  {pre:'They sell these prayer mats online.',q:'These prayer mats ___ online.',o:['are sold','is sold','are sell'],why:'plural subject → are'}
],{title:'Passive'}));

add('Comparatives & superlatives',`<div class="wrap"><span class="kicker">📊 Grammar 2</span><h2 class="title">Comparatives &amp; Superlatives</h2>
<p class="sub">Compare <b>two</b> things with the <b class="hl">comparative</b>. Compare <b>three or more</b> with the <b class="hl">superlative</b>.</p>
<div class="grid g3">
<div class="card"><h3>Short adjectives</h3><p class="mid" style="margin:0">cheap → <b class="hl">cheaper</b> → <b class="hp">the cheapest</b><br>big → <b class="hl">bigger</b> → <b class="hp">the biggest</b><br>pretty → <b class="hl">prettier</b> → <b class="hp">the prettiest</b></p></div>
<div class="card"><h3>Long adjectives</h3><p class="mid" style="margin:0">expensive → <b class="hl">more expensive</b> → <b class="hp">the most expensive</b><br>elegant → <b class="hl">more elegant</b> → <b class="hp">the most elegant</b></p></div>
<div class="card"><h3>Irregular</h3><p class="mid" style="margin:0">good → <b class="hl">better</b> → <b class="hp">the best</b><br>bad → <b class="hl">worse</b> → <b class="hp">the worst</b></p></div>
</div>
<div class="grid g3" style="margin-top:14px" id="perf"></div>

add('as … as / not as … as',`<div class="wrap"><span class="kicker">⚖️ Grammar 3</span><h2 class="title">Similarities &amp; Differences</h2>
<div class="grid g2">

<div class="card" style="border-color:#f3d2bd"><h3 style="color:#c45f22">❌ not as + adjective + as</h3><p class="mid" style="margin:0">Two things are <b>not the same</b>.</p><p class="mid">👜 My bag is <b style="color:#c45f22">not as big as</b> my sister's bag.</p></div>
</div>
<div class="pics2" style="margin-top:14px">

<div class="pic"><img src="img/gifts.avif" alt="Two gifts, 30 SAR and 50 SAR" width="720" height="405" loading="lazy"><div class="cap">🎁 The green gift is <b style="color:#f3d68c">not as expensive as</b> the blue gift.</div></div>
</div>

/* ---------- builder ---------- */
function builder(el,list){
  let i=0;
  function render(){
    if(i>=list.length){el.innerHTML=`<div class="card" style="text-align:center"><div class="emoji">🏆</div><p class="big">You built all ${list.length} sentences!</p><button class="btn" data-r>Play again ↻</button></div>`;confetti();$('[data-r]',el).onclick=()=>{i=0;render()};return}
    const ans=list[i],pool=shuffle(ans.map((w,k)=>({w,k})));let picked=[];

/* ---------- teams ---------- */
const TEAMS=[{n:'Taif Roses',e:'🌹',s:0,on:true},{n:'Palms',e:'🌴',s:0,on:true},{n:'Falcons',e:'🦅',s:0,on:true},{n:'Pearls',e:'🦪',s:0,on:false}];
function drawTeams(){const el=$('#teams');el.innerHTML=TEAMS.map((t,k)=>t.on?`<div class="tm">${t.e} ${t.n} <button class="m" data-k="${k}" data-d="-1">−</button><b>${t.s}</b><button data-k="${k}" data-d="1">+</button></div>`:'').join('');
  $$('button',el).forEach(b=>b.onclick=()=>{const t=TEAMS[b.dataset.k];t.s=Math.max(0,t.s+ +b.dataset.d);if(+b.dataset.d>0){beep(true)}drawTeams()})}
$('#tTeams').onclick=()=>{$('#teams').classList.toggle('hide');drawTeams()};

/* ---------- timer ---------- */
let tInt;function startTimer(sec){const el=$('#timer');clearInterval(tInt);let t=sec;el.className='timer on';
  const f=()=>{el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`};f();
  tInt=setInterval(()=>{t--;f();if(t<=0){clearInterval(tInt);el.className='timer on end';beep(false);setTimeout(()=>el.className='timer',4000)}},1000);
  el.onclick=()=>{clearInterval(tInt);el.className='timer'}}
$('#tTimer').onclick=()=>{const v=prompt('Timer – how many seconds?','60');if(v&&+v>0)startTimer(Math.round(+v))};

/* ---------- navigation ---------- */
const stage=$('#stage');
stage.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}">${s.game?'<button class="fsbtn" onclick="toggleFS(true)">⛶ Play full screen</button>':''}${s.html}</section>`).join('');
let cur=0;
function go(i){i=Math.max(0,Math.min(S.length-1,i));if(i!==cur){clearInterval(tfInt);$$('video').forEach(v=>v.pause());const f=$('#vid');try{f&&f.contentWindow&&f.contentWindow.postMessage('pause','*')}catch(e){}}
  $$('.slide').forEach(s=>s.classList.toggle('on',+s.dataset.i===i));cur=i;const sl=$$('.slide')[i];sl.scrollTop=0;
  if(S[i].init&&(!sl.dataset.done||S[i].name==='Game: Speed true or false')){S[i].init();sl.dataset.done=1}else if(S[i].init&&S[i].name==='Homework')confetti(120);
  $('#barI').style.width=((i+1)/S.length*100)+'%';$('#cnt').textContent=`${i+1}/${S.length}`;$('#prev').disabled=i===0;$('#next').disabled=i===S.length-1;
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
window.go=go;window.startTimer=startTimer;
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key===' '&&!e.target.closest('button'))go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=null,sy=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&!e.target.closest('.mem,.wheelbox'))go(cur+(dx<0?1:-1));sx=null},{passive:true});
const sh=$('#sheet');
$('#tMenu').onclick=()=>{sh.innerHTML='<h3 class="fd" style="color:var(--plum);padding:4px 12px 10px">Lesson map</h3>'+S.map((s,i)=>`<a href="#" data-i="${i}" class="${i===cur?'cur':''}"><span>${i+1}</span>${s.name}</a>`).join('');
  $$('a',sh).forEach(a=>a.onclick=e=>{e.preventDefault();$('#menu').classList.remove('on');go(+a.dataset.i)});$('#menu').classList.add('on')};
$('#menu').onclick=e=>{if(e.target.id==='menu')e.currentTarget.classList.remove('on')};
const h=parseInt(location.hash.slice(1));go(h>0?h-1:0);
</script>
</body>
</html>
